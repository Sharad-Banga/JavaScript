<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .tabs{
      width: 400px;
      display: flex;
      justify-content: space-between;
    }
    .contents{
      width: 400px;
      display: flex;
      justify-content: space-between;
    }
    .tab.active{
      color: rgb(255, 255, 255);
      background-color: black;
    }
    .content.active{
      display: block;
    }
    .content{
      display:none;
    }
  </style>
</head>
<body>
  <div class="tabs">
    <button class="tab active" data-tab="1">tab1</button>
    <button class="tab" data-tab="2">tab2</button>
    <button class="tab" data-tab="3">tab3</button>
  </div>
  <br>
  <div class="contents">
    <div class="content active" data-content="1">
      content 1
    </div>
    <div class="content" data-content="2">
      content 2
    </div>
    <div class="content" data-content="3">
      content 3
    </div>
  </div>
  <script src="./script7.js"> </script>
</body>
</html>
