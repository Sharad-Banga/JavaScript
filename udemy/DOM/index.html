<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
    body{
      background-color: #1a1a1a;
      color: #fff;
    }
    .high{
      background: red;
    }
  </style>
</head>
<body>
    
  <section id="example-1">
    <h2>Accessing DOM Element</h2>
    <p id="myParagraph">
      This is a Paragraph. Click the button to change me!
    </p>
    <button id="changeTextButton">Change Text</button>
  </section>




  <section id="example-2">
    <h2>Traversing the DOM</h2>
    <ul id="citiesList">
      <li class="c1">New York</li>
      <li>Tokyo</li>
      <li>Paris</li>
      <li>London</li>
    </ul>
    <button id="HighlightFirstCity">Highlight First City</button>
  </section>






  <section id="example-3">
    <h2>Manipulating DOM elemnent</h2>
    <div id="coffeeOrder">
      Order: <span id="coffeeType">Latte</span> </div>
      
      <button id="changeOrder">Change Order to Espresso</button>
   
  </section>





  <section id="example-4">
    <h2>Creating and Inserting Element</h2>
    <button id="addNewItem">Add a new Item to the Shopping List</button>

    <ul id="shoppingList">
      <li>Break</li>
      <li>Milk</li>
    </ul>
  </section>



  <section id="example-5">
    <h2>Creating and Inserting Element</h2>
    <button id="removeItem">Remove Last Item to the Shopping List</button>

    <ul id="shoppingList-5">
      <li>Break</li>
      <li>Milk</li>
    </ul>
  </section>






  <script  src="./one.js"></script>
</body>
</html>
